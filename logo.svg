<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b61ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 外圈 -->
  <circle cx="50" cy="50" r="45" stroke="url(#grad1)" stroke-width="2" fill="none" opacity="0.5"/>
  <!-- 内圈 -->
  <circle cx="50" cy="50" r="35" stroke="#00f5d4" stroke-width="1.5" fill="none" opacity="0.3"/>
  <!-- T 字母 -->
  <path d="M30 35 L70 35 M50 35 L50 70" stroke="url(#grad1)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 装饰点 -->
  <circle cx="50" cy="20" r="3" fill="#00f5d4"/>
  <circle cx="80" cy="50" r="2" fill="#7b61ff"/>
  <circle cx="20" cy="50" r="2" fill="#7b61ff"/>
</svg>
