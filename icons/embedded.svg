<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="embed-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5d4"/>
      <stop offset="100%" style="stop-color:#7b61ff"/>
    </linearGradient>
  </defs>
  <!-- 芯片主体 -->
  <rect x="12" y="12" width="24" height="24" rx="3" fill="url(#embed-grad)" opacity="0.9"/>
  <!-- 芯片核心 -->
  <rect x="18" y="18" width="12" height="12" rx="2" fill="#0a0e14" opacity="0.3"/>
  <!-- 引脚 - 上 -->
  <rect x="16" y="4" width="2" height="8" rx="1" fill="url(#embed-grad)"/>
  <rect x="23" y="4" width="2" height="8" rx="1" fill="url(#embed-grad)"/>
  <rect x="30" y="4" width="2" height="8" rx="1" fill="url(#embed-grad)"/>
  <!-- 引脚 - 下 -->
  <rect x="16" y="36" width="2" height="8" rx="1" fill="url(#embed-grad)"/>
  <rect x="23" y="36" width="2" height="8" rx="1" fill="url(#embed-grad)"/>
  <rect x="30" y="36" width="2" height="8" rx="1" fill="url(#embed-grad)"/>
  <!-- 引脚 - 左 -->
  <rect x="4" y="16" width="8" height="2" rx="1" fill="url(#embed-grad)"/>
  <rect x="4" y="23" width="8" height="2" rx="1" fill="url(#embed-grad)"/>
  <rect x="4" y="30" width="8" height="2" rx="1" fill="url(#embed-grad)"/>
  <!-- 引脚 - 右 -->
  <rect x="36" y="16" width="8" height="2" rx="1" fill="url(#embed-grad)"/>
  <rect x="36" y="23" width="8" height="2" rx="1" fill="url(#embed-grad)"/>
  <rect x="36" y="30" width="8" height="2" rx="1" fill="url(#embed-grad)"/>
  <!-- 核心电路 -->
  <circle cx="21" cy="21" r="1.5" fill="#00f5d4"/>
  <circle cx="27" cy="21" r="1.5" fill="#7b61ff"/>
  <circle cx="21" cy="27" r="1.5" fill="#7b61ff"/>
  <circle cx="27" cy="27" r="1.5" fill="#00f5d4"/>
  <line x1="21" y1="21" x2="27" y2="27" stroke="#00f5d4" stroke-width="0.5" opacity="0.6"/>
  <line x1="27" y1="21" x2="21" y2="27" stroke="#7b61ff" stroke-width="0.5" opacity="0.6"/>
</svg>
